setw -g mode-keys vi
set -g default-terminal "tmux-256color"

# --- local vs. remote, at a glance -------------------------------------------
# This is the SAME symlinked file on both machines, so anything host-specific
# branches on the hostname. Calm blue = this laptop. Loud orange = the dev box.
# The label is #h (the real hostname), so an unexpected host tells the truth
# instead of quietly impersonating the laptop.
%if "#{==:#{host_short},mac}"
  set  -g status-style                "bg=#005f87,fg=#ffffff"
  set  -g status-left                 "#[bg=#00005f,fg=#ffffff,bold] #h #[default] "
  set  -g window-status-current-style "bg=#ffffff,fg=#00005f,bold"
  set  -g pane-active-border-style    "fg=#005f87"
  setw -g window-style                bg="#f5f5f5"
%else
  set  -g status-style                "bg=#d75f00,fg=#ffffff"
  set  -g status-left                 "#[bg=#5f0000,fg=#ffffff,bold] #h #[default] "
  set  -g window-status-current-style "bg=#ffffff,fg=#5f0000,bold"
  set  -g pane-active-border-style    "fg=#d75f00"
  # panes carry a faint warm tint too, so the whole screen reads "remote"
  setw -g window-style                bg="#f7f1ea"
%endif

set  -g status-left-length 16
set  -g status-right       "#[bold]#S #[nobold,dim]%H:%M "
setw -g window-active-style bg="#ffffff"

unbind F2
bind-key -n F2 resize-pane -Z
bind-key -n § resize-pane -Z

bind C-b last-window

bind-key A command-prompt -p "raname window to:" "rename-window '%%'"

set-window-option -g xterm-keys

setw -g monitor-activity on
set -g visual-activity on

setw -g monitor-activity on
set -g visual-activity on

bind e run "tmux save-buffer /tmp/tmux-exchange" \; display "tmux-exchange written!"

# sane scrolling
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# command history
set-option -g history-limit 10000

# pane movement
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"

bind-key r refresh-client

set -g mode-style bg=red,fg=white,bright

set -g @shell_mode 'vi'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jbnicolai/tmux-fpp'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-urlview'

# Clipboard: tmux-yank pipes every copy (y / Enter / mouse release) into pbcopy,
# which feeds the Mac via the reverse tunnel and mirrors to the X clipboard.
set -g @override_copy_command '/home/artiom/bin/pbcopy'
set -g mouse on
# drag always selects via tmux copy mode, even in apps that grab the mouse (claude code)
bind -n MouseDrag1Pane if -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -M'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'

bind -n C-M-k send-keys C-k
